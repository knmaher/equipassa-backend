spring:
  profiles:
    active: prod

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never     # use Flyway to create SPRING_SESSION tables in prod

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        default_schema: public

  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${EQUIPASSA_PORT:8081}
  forward-headers-strategy: native
  error:
    include-message: never
    include-binding-errors: never
  compression:
    enabled: true
  http2:
    enabled: true

management:
  server:
  # optionally run actuator on a separate port:
  # port: ${MANAGEMENT_PORT:9090}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    com.equipassa: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  extendedExpiration: ${JWT_EXTENDED_EXPIRATION:2592000000}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION:604800000}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT}
    bucket: ${AWS_S3_BUCKET}
    accessKey: ${AWS_S3_ACCESS_KEY}
    secretKey: ${AWS_S3_SECRET_KEY}
    region: ${AWS_S3_REGION:eu-central-1}

equipassa:
  email:
    from-address: "no-reply@equipassa.com"
  server: ${EQUIPASSA_SERVER:https://api.equipassa.com}

# App-level settings used by security classes
kube:
  probe:
    token: ${KUBE_PROBE_TOKEN}

security:
  remember-me:
    key: ${REMEMBER_ME_KEY}   # only if you enabled remember-me/persistent tokens

# Optionally drive CORS from config instead of hardcoding in SecurityConfig:
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.equipassa.com}
